# Which model each task tier means for tiroir's lanes (Établi
# conventions, "Mapping a tier to a model"). A developer's own
# ~/.config/etabli/tiers.conf takes precedence over this file.
[plan]
    harness = claude
    model = opus

[build]
    harness = claude
    model = sonnet

[chore]
    harness = claude
    model = haiku
