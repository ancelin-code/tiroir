# The user documentation site, built by `mise run docs:build` and published to
# GitHub Pages from `develop` by .github/workflows/docs.yml.
[project]
site_name = "Tiroir"
site_description = "Configurable, scoped memory for AI agents, served to your team from your own server."
site_url = "https://ancelin-code.github.io/tiroir/"
repo_url = "https://github.com/ancelin-code/tiroir"
edit_uri = "edit/develop/docs"
copyright = "Apache-2.0"
strict = true
extra_css = ["assets/extra.css"]

# The site is the user documentation only: the brief, the research notes and
# the milestone notes stay in the repository, out of the site.
exclude_docs = """
brief.md
research/
milestones/
"""

nav = [
  { "Home" = "index.md" },
  { "Server Installation" = [
    { "Installation Guide" = "install/vps.md" },
    { "Custom Schema" = "install/custom-schema.md" },
  ] },
  { "Client Installation" = [
    { "Connect Claude Desktop" = "connect/claude-desktop.md" },
  ] },
  { "Reference" = [
    { "CLI Reference" = "reference/cli.md" },
    { "Schema Reference" = "reference/schema.md" },
    { "Presets" = "reference/presets.md" },
  ] },
  { "Roadmap" = "roadmap.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
# A copy button at the top right of every code block.
features = ["content.code.copy"]

# Light and dark palettes, following the visitor's system preference first.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "brown"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "brown"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.llmstxt]
markdown_description = "Tiroir is a self-hosted memory server for teams of AI agents: install it on a VPS, connect Claude Desktop, and administer it from the command line."

[project.plugins.llmstxt.sections]
"Get started" = ["index.md", "install/vps.md", "connect/claude-desktop.md", "install/custom-schema.md"]
Reference = ["reference/cli.md", "reference/schema.md"]
Project = ["roadmap.md", "changelog.md"]
