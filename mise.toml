[tools]
python = "3.13"
uv = "0.12.10"

[tasks.sync]
description = "Install the locked dependencies"
run = "uv sync --frozen"

[tasks.lint]
description = "Lint, check formatting and the dependency rule"
depends = ["sync"]
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run lint-imports",
]

[tasks.format]
description = "Format the code"
depends = ["sync"]
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks.typecheck]
description = "Type-check the package"
depends = ["sync"]
run = "uv run pyrefly check"

[tasks.test]
description = "Run every test"
depends = ["sync"]
run = "uv run pytest"

[tasks."test:unit"]
description = "Run the unit tests only (fast)"
depends = ["sync"]
run = "uv run pytest tests/unit"

[tasks.licenses]
description = "Refuse a locked dependency under a GPL-family licence (ADR-001, ADR-002)"
depends = ["sync"]
# pygit2 is GPLv2 with the libgit2 linking exception, which allows linking it
# into an Apache-2.0 program: it is the one reviewed exception.
run = "uv run pip-licenses --partial-match --fail-on=GPL --ignore-packages pygit2"

[tasks.check]
description = "Run every check"
depends = ["lint", "typecheck", "test"]

[tasks."docs:build"]
description = "Build the documentation site into site/, failing on any warning"
depends = ["sync"]
run = "uv run zensical build --clean --strict"

[tasks."docs:serve"]
description = "Serve the documentation site locally, rebuilt on each change"
depends = ["sync"]
run = "uv run zensical serve"

[tasks.serve]
description = "Run the server"
depends = ["sync"]
run = "uv run tiroir admin serve"

[tasks.image]
description = "Build the container image locally and print its compressed size"
run = """
docker build -t tiroir:local .
docker save tiroir:local | gzip | wc -c | awk '{printf "compressed size: %.1f MB\\n", $1 / 1000000}'
"""

[tasks.stack]
description = "Start the Compose stack"
run = "docker compose up -d --build"
