services:
  tiroir:
    image: ghcr.io/ancelin-code/tiroir:${TIROIR_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      # The public origin, https:// and this domain, is the OAuth issuer.
      TIROIR_DOMAIN: ${TIROIR_DOMAIN:?set TIROIR_DOMAIN in .env}
      # Only Caddy, on this stack's network, may tell tiroir a client's
      # address (X-Forwarded-For); a request from anywhere else is taken as is.
      TIROIR_TRUSTED_PROXIES: ${TIROIR_PROXY_SUBNET:-172.30.80.0/24}
    volumes:
      - tiroir-data:/data

  caddy:
    image: caddy:2.11.2
    restart: unless-stopped
    depends_on:
      - tiroir
    ports:
      - "80:80"
      - "443:443"
    environment:
      TIROIR_DOMAIN: ${TIROIR_DOMAIN:?set TIROIR_DOMAIN in .env}
      TIROIR_ACME_EMAIL: ${TIROIR_ACME_EMAIL:?set TIROIR_ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  default:
    ipam:
      config:
        - subnet: ${TIROIR_PROXY_SUBNET:-172.30.80.0/24}

volumes:
  tiroir-data:
  caddy-data:
  caddy-config:
