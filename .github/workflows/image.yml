name: image

on:
  pull_request:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}
  MAX_COMPRESSED_BYTES: 600000000 # ADR-002: 600 MB compressed

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - name: Build both architectures
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # One archive per architecture, with gzip layers: its size is the size a
      # registry stores. The layers come from the build cache of the step above.
      - name: Export the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=amd64.tar,compression=gzip
          cache-from: type=gha
      - name: Export the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          outputs: type=oci,dest=arm64.tar,compression=gzip
          cache-from: type=gha
      - name: Check the compressed size of each architecture
        run: |
          set -eu
          for platform in amd64 arm64; do
            size=$(wc -c < "$platform.tar")
            echo "$platform: $size bytes compressed"
            [ "$size" -le "$MAX_COMPRESSED_BYTES" ] || { echo "$platform exceeds 600 MB"; exit 1; }
          done
      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
