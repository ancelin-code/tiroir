<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose your password - tiroir</title>
</head>
<body>
<main>
<h1>tiroir</h1>
<h2>Choose your password</h2>
<p>The password you were given works only once. Choose your own, of at least
12 characters.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/signin">
<input type="hidden" name="csrf" value="{{ csrf }}">
<input type="hidden" name="next" value="{{ next }}">
<p><label for="new_password">New password</label><br>
<input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required autofocus></p>
<p><label for="confirm_password">New password, again</label><br>
<input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></p>
<p><button type="submit">Save my password</button></p>
</form>
</main>
</body>
</html>
